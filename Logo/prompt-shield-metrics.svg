<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="#0d1117"/>
  <rect width="800" height="200" rx="12" fill="none" stroke="#1a3a1a" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="44" rx="12" fill="#111b11"/>
  <rect x="0" y="32" width="800" height="12" fill="#111b11"/>
  <text x="24" y="28" fill="#00c853" font-size="14" font-weight="700">PROMPT SHIELD</text>
  <text x="220" y="28" fill="#6e7681" font-size="12">Performance metrics</text>
  
  <!-- Metric 1: F1 Score -->
  <g transform="translate(24, 64)">
    <text fill="#6e7681" font-size="10" y="0">F1 SCORE</text>
    <text fill="#00c853" font-size="32" font-weight="700" y="38">0.99</text>
    <!-- Mini bar -->
    <rect y="48" width="100" height="4" rx="2" fill="#1a2e1a"/>
    <rect y="48" width="99" height="4" rx="2" fill="#00c853"/>
  </g>
  
  <!-- Metric 2: FPR -->
  <g transform="translate(154, 64)">
    <text fill="#6e7681" font-size="10" y="0">FALSE POSITIVE</text>
    <text fill="#39ff14" font-size="32" font-weight="700" y="38">&lt;1%</text>
    <rect y="48" width="100" height="4" rx="2" fill="#1a2e1a"/>
    <rect y="48" width="3" height="4" rx="2" fill="#39ff14"/>
  </g>
  
  <!-- Metric 3: Single Turn -->
  <g transform="translate(284, 64)">
    <text fill="#6e7681" font-size="10" y="0">SINGLE-TURN BLOCK</text>
    <text fill="#00c853" font-size="32" font-weight="700" y="38">97.5%</text>
    <rect y="48" width="100" height="4" rx="2" fill="#1a2e1a"/>
    <rect y="48" width="97" height="4" rx="2" fill="#00c853"/>
  </g>
  
  <!-- Metric 4: Multi Turn -->
  <g transform="translate(440, 64)">
    <text fill="#6e7681" font-size="10" y="0">MULTI-TURN BLOCK</text>
    <text fill="#39ff14" font-size="32" font-weight="700" y="38">80%</text>
    <rect y="48" width="100" height="4" rx="2" fill="#1a2e1a"/>
    <rect y="48" width="80" height="4" rx="2" fill="#39ff14"/>
  </g>
  
  <!-- Metric 5: Latency -->
  <g transform="translate(580, 64)">
    <text fill="#6e7681" font-size="10" y="0">MEDIAN LATENCY</text>
    <text fill="#00c853" font-size="32" font-weight="700" y="38">906ms</text>
    <rect y="48" width="100" height="4" rx="2" fill="#1a2e1a"/>
    <rect y="48" width="45" height="4" rx="2" fill="#00c853"/>
  </g>

  <!-- Bottom tags -->
  <g transform="translate(24, 148)">
    <!-- Tag: Zero Trust -->
    <rect x="0" y="0" width="82" height="24" rx="12" fill="#1a2e1a"/>
    <text x="41" y="16" fill="#00c853" font-size="10" text-anchor="middle">Zero Trust</text>
    
    <rect x="92" y="0" width="118" height="24" rx="12" fill="#1a2e1a"/>
    <text x="151" y="16" fill="#00c853" font-size="10" text-anchor="middle">Defense in Depth</text>
    
    <rect x="220" y="0" width="60" height="24" rx="12" fill="#1a2e1a"/>
    <text x="250" y="16" fill="#00c853" font-size="10" text-anchor="middle">STRIDE</text>
    
    <rect x="290" y="0" width="76" height="24" rx="12" fill="#1a2e1a"/>
    <text x="328" y="16" fill="#00c853" font-size="10" text-anchor="middle">DeBERTa</text>
    
    <rect x="376" y="0" width="110" height="24" rx="12" fill="#1a2e1a"/>
    <text x="431" y="16" fill="#00c853" font-size="10" text-anchor="middle">MITRE ATT&amp;CK</text>
    
    <rect x="496" y="0" width="116" height="24" rx="12" fill="#1a2e1a"/>
    <text x="554" y="16" fill="#00c853" font-size="10" text-anchor="middle">OWASP Top 10</text>
    
    <rect x="622" y="0" width="86" height="24" rx="12" fill="#1a2e1a"/>
    <text x="665" y="16" fill="#00c853" font-size="10" text-anchor="middle">&lt;430ms OH</text>
  </g>
</svg>
