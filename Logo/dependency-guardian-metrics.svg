<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="#0d1117"/>
  <rect width="800" height="200" rx="12" fill="none" stroke="#1a3a1a" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="44" rx="12" fill="#111b11"/>
  <rect x="0" y="32" width="800" height="12" fill="#111b11"/>
  <text x="24" y="28" fill="#00c853" font-size="14" font-weight="700">AI DEPENDENCY GUARDIAN</text>
  <text x="310" y="28" fill="#6e7681" font-size="12">Capabilities overview</text>
  
  <!-- Feature 1: Scanning -->
  <g transform="translate(24, 64)">
    <rect width="168" height="70" rx="8" fill="#111b11" stroke="#1a3a1a" stroke-width="0.5"/>
    <text x="14" y="22" fill="#6e7681" font-size="10">SCANNING</text>
    <text x="14" y="44" fill="#00c853" font-size="13" font-weight="700">requirements.txt</text>
    <text x="14" y="60" fill="#39ff14" font-size="13" font-weight="700">package.json</text>
  </g>
  
  <!-- Feature 2: Vulnerability DBs -->
  <g transform="translate(206, 64)">
    <rect width="148" height="70" rx="8" fill="#111b11" stroke="#1a3a1a" stroke-width="0.5"/>
    <text x="14" y="22" fill="#6e7681" font-size="10">VULN DATABASES</text>
    <text x="14" y="44" fill="#00c853" font-size="22" font-weight="700">NVD</text>
    <text x="74" y="44" fill="#39ff14" font-size="22" font-weight="700">OSV</text>
    <!-- Divider dot -->
    <circle cx="64" cy="38" r="2" fill="#6e7681"/>
  </g>
  
  <!-- Feature 3: Risk Scoring -->
  <g transform="translate(368, 64)">
    <rect width="128" height="70" rx="8" fill="#111b11" stroke="#1a3a1a" stroke-width="0.5"/>
    <text x="14" y="22" fill="#6e7681" font-size="10">RISK SCORING</text>
    <text x="14" y="48" fill="#00c853" font-size="26" font-weight="700">CVSS</text>
  </g>
  
  <!-- Feature 4: AI Reports -->
  <g transform="translate(510, 64)">
    <rect width="128" height="70" rx="8" fill="#111b11" stroke="#1a3a1a" stroke-width="0.5"/>
    <text x="14" y="22" fill="#6e7681" font-size="10">AI REPORTS</text>
    <text x="14" y="48" fill="#39ff14" font-size="18" font-weight="700">Gemini</text>
  </g>
  
  <!-- Feature 5: Auto Patch -->
  <g transform="translate(652, 64)">
    <rect width="128" height="70" rx="8" fill="#111b11" stroke="#1a3a1a" stroke-width="0.5"/>
    <text x="14" y="22" fill="#6e7681" font-size="10">AUTO PATCHING</text>
    <!-- Checkmark -->
    <text x="14" y="52" fill="#00c853" font-size="26" font-weight="700">&#x2713;</text>
    <text x="44" y="48" fill="#00c853" font-size="14" font-weight="700">Enabled</text>
  </g>
  
  <!-- Bottom tags -->
  <g transform="translate(24, 152)">
    <rect x="0" y="0" width="155" height="24" rx="12" fill="#1a2e1a"/>
    <text x="78" y="16" fill="#00c853" font-size="10" text-anchor="middle">Planner-Executor-Memory</text>
    
    <rect x="165" y="0" width="104" height="24" rx="12" fill="#1a2e1a"/>
    <text x="217" y="16" fill="#00c853" font-size="10" text-anchor="middle">Risk Tracking</text>
    
    <rect x="279" y="0" width="96" height="24" rx="12" fill="#1a2e1a"/>
    <text x="327" y="16" fill="#00c853" font-size="10" text-anchor="middle">Streamlit UI</text>
    
    <rect x="385" y="0" width="96" height="24" rx="12" fill="#1a2e1a"/>
    <text x="433" y="16" fill="#00c853" font-size="10" text-anchor="middle">Rate Limiting</text>
    
    <rect x="491" y="0" width="115" height="24" rx="12" fill="#1a2e1a"/>
    <text x="549" y="16" fill="#00c853" font-size="10" text-anchor="middle">Secure Downloads</text>
  </g>
</svg>
